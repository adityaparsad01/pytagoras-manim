name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pythagorean-video-render-v2
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pango build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango1.0-dev

      - name: Install ManimGL
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools<81' manimgl

      - name: Render ManimGL
        run: |
          chmod +x render.sh
          ./render.sh

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: pythagorean-theorem-video
          path: dist/pythagorean_theorem.mp4
          retention-days: 30
